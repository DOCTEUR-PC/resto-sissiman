name = "resto-sissiman"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
routes = [
    { pattern = "resto.docteurpc.org/*", zone_name = "docteurpc.org" }
]

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "sissiman"
database_id = "18abe3d3-d90c-4d8b-81bc-26d681e0d34f"
